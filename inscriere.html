<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înscriere — Școala de Lumânăreală</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #F8F5F0;
            --color-bg-white: #FFFFFF;
            --color-bg-alt: #E8DED1;

            --color-text: #4A3728;
            --color-accent: #B87333;
            --color-eucalipt: #4A6352;
            --color-eucalipt-light: #7A9180;
            --color-border: #D4C8BA;

            --font-serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
            --font-sans: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            color: var(--color-eucalipt);
            background: var(--color-bg);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3 { font-family: var(--font-serif); font-weight: 400; color: var(--color-eucalipt); }
        p, span, a, label { color: var(--color-eucalipt); }
        em { font-style: italic; color: var(--color-accent); font-weight: 500; }

        .form-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px 32px;
            background: var(--color-bg-white);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(74, 99, 82, 0.08);
            width: 90%;
        }

        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            text-decoration: none;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            font-family: var(--font-sans);
            font-size: 15px;
            color: var(--color-eucalipt);
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--color-eucalipt);
            background: var(--color-bg-white);
        }

        select.form-control {
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%234A6352%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 16px top 50%;
            background-size: 10px auto;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--color-eucalipt);
            color: var(--color-bg-white);
            border: none;
            border-radius: 4px;
            font-family: var(--font-sans);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 12px;
        }

        .btn-submit:hover {
            background: var(--color-accent);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 1; text-decoration: underline; }

    </style>
</head>
<body>

<div class="form-container">
    <!-- Logo Header -->
    <a href="index.html" class="header-logo">
        <img src="flacara-monica.svg" alt="Flacără" style="width: 48px; height: auto; flex-shrink: 0;">
        <div style="width: 1px; height: 40px; background-color: var(--color-accent); opacity: 0.5;"></div>
        <div style="line-height: 1.1; text-align: left;">
            <div style="font-size: 14px; letter-spacing: 2px;">ȘCOALA <span style="font-family: var(--font-serif); font-style: italic; text-transform: none; font-size: 16px; color: var(--color-accent);">&ndash; de &ndash;</span></div>
            <div style="font-size: 20px; font-weight: 700; letter-spacing: 1px;">LUMÂNĂREALĂ</div>
        </div>
    </a>

    <div style="text-align: center; margin-bottom: 32px;">
        <h2 style="font-size: 28px; margin-bottom: 12px;">Finalizare <em>Înscriere</em></h2>
        <p style="font-size: 14px; opacity: 0.8;">Completează datele de mai jos, iar Monica te va contacta pe WhatsApp cu detaliile de plată și accesul la curs.</p>
    </div>

    <!-- Formularul Web3Forms -->
    <form action="https://api.web3forms.com/submit" method="POST">
        <!-- INSTRUCTIUNE: Aici pui Access Key-ul tău -->
        <input type="hidden" name="access_key" value="a7c91325-219c-4350-ab0d-3dce71bb5e3b">

        <!-- Redirecționarea către pagina de Thank You -->
        <input type="hidden" name="redirect" value="https://scoala-lumanareala.vercel.app/thank-you.html">

        <!-- Subiectul emailului pe care îl veți primi -->
        <input type="hidden" name="subject" value="Înscriere nouă - Școala de Lumânăreală!">

        <div class="form-group">
            <label for="nume">Nume și Prenume</label>
            <input type="text" id="nume" name="Nume" class="form-control" placeholder="ex: Maria Popescu" required>
        </div>

        <div class="form-group">
            <label for="telefon">Număr de WhatsApp</label>
            <input type="tel" id="telefon" name="Telefon" class="form-control" placeholder="ex: 07XX XXX XXX" required>
        </div>

        <div class="form-group">
            <label for="email">Adresă de Email</label>
            <input type="email" id="email" name="Email" class="form-control" placeholder="ex: maria@email.com" required>
        </div>

        <div class="form-group">
            <label for="pachet">Ce pachet dorești?</label>
            <select id="pachet" name="Pachet_Ales" class="form-control" required>
                <option value="" disabled selected>Alege un pachet...</option>
                <option value="START">Pachet START (297 lei)</option>
                <option value="START PLUS">Pachet START PLUS (397 lei)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Trimite datele</button>
    </form>

    <a href="index.html" class="back-link">← Întoarce-te la pagina principală</a>
    <input type="hidden" name="redirect" value="https://scoala-de-lumanareala.vercel.app/thank-you.html">
</div>

</body>
</html>
