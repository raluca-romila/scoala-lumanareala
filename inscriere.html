<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înscriere — Școala de Lumânăreală</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #F8F5F0;
            --color-bg-white: #FFFFFF;
            --color-bg-alt: #E8DED1;

            --color-text: #4A3728;
            --color-accent: #B87333;
            --color-eucalipt: #4A6352;
            --color-eucalipt-light: #7A9180;
            --color-border: #D4C8BA;

            --font-serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
            --font-sans: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            color: var(--color-eucalipt);
            background: var(--color-bg);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
        }

        h1, h2, h3 { font-family: var(--font-serif); font-weight: 400; color: var(--color-eucalipt); }
        p, span, a, label { color: var(--color-eucalipt); }
        em { font-style: italic; color: var(--color-accent); font-weight: 500; }

        .form-container {
            max-width: 520px;
            margin: 40px auto;
            padding: 48px 40px;
            background: transparent;
            border-radius: 8px;
            border: 1px solid rgba(212, 200, 186, 0.3);
            backdrop-filter: blur(10px);
            width: 90%;
        }

        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            text-decoration: none;
        }

        .form-row-dual {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--color-eucalipt-light);
        }

        .form-control {
            width: 100%;
            font-family: var(--font-sans);
            font-size: 15px;
            color: var(--color-eucalipt);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--color-border);
            border-radius: 0;
            padding: 8px 0;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-bottom-color: var(--color-eucalipt);
        }

        /* Carduri pachete interactive */
        .package-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .package-option {
            border: 1px solid var(--color-border);
            padding: 14px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            background: transparent;
            display: block;
        }

        .package-option input[type="radio"] {
            display: none;
        }

        .package-option:has(input:checked) {
            border-color: var(--color-eucalipt);
            background: rgba(74, 99, 82, 0.04);
        }

        .package-option:has(input:checked) .pkg-price {
            color: var(--color-accent);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--color-eucalipt);
            color: var(--color-bg-white);
            border: none;
            border-radius: 4px;
            font-family: var(--font-sans);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 12px;
        }

        .btn-submit:hover {
            background: var(--color-accent);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            text-decoration: none;
            color: var(--color-eucalipt-light);
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 1; text-decoration: underline; }

        @media (max-width: 500px) {
            .form-row-dual { grid-template-columns: 1fr; gap: 0; }
            .form-container { padding: 32px 20px; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <!-- Logo Header -->
    <a href="index.html" class="header-logo">
        <img src="flacara-monica.svg" alt="Flacără" style="width: 48px; height: auto; flex-shrink: 0;">
        <div style="width: 1px; height: 40px; background-color: var(--color-accent); opacity: 0.5;"></div>
        <div style="line-height: 1.1; text-align: left;">
            <div style="font-size: 14px; letter-spacing: 2px; color: var(--color-eucalipt);">ȘCOALA &ndash; de &ndash;</div>
            <div style="font-size: 20px; font-weight: 700; letter-spacing: 1px; color: var(--color-eucalipt);">LUMÂNĂREALĂ</div>
        </div>
    </a>

    <div style="text-align: center; margin-bottom: 36px;">
        <h2 style="font-size: 30px; margin-bottom: 8px;">Înscriere <em>Atelier</em></h2>
        <p style="font-size: 14px; color: var(--color-eucalipt-light);">Completează detaliile pentru a rezerva locul tău.</p>
    </div>

    <!-- Formularul Web3Forms -->
    <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="a7c91325-219c-4350-ab0d-3dce71bb5e3b">
        <input type="hidden" name="redirect" value="https://scoala-de-lumanareala.vercel.app/thank-you.html">
        <input type="hidden" name="subject" value="Înscriere nouă - Școala de Lumânăreală!">

        <!-- Nume & Prenume (Dual Row) -->
        <div class="form-row-dual">
            <div class="form-group">
                <label>Prenume</label>
                <input type="text" name="Prenume" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Nume</label>
                <input type="text" name="Nume" class="form-control" required>
            </div>
        </div>

        <!-- Număr WhatsApp -->
        <div class="form-group">
            <label>Număr WhatsApp</label>
            <input type="tel" name="Telefon" class="form-control" required>
        </div>

        <!-- Adresă Email -->
        <div class="form-group">
            <label>Adresă Email</label>
            <input type="email" name="Email" class="form-control" required>
        </div>

        <!-- Pachet Ales (Carduri interactive) -->
        <div class="form-group" style="margin-top: 28px;">
            <label>Alege pachetul dorit</label>
            <div class="package-grid">
                <label class="package-option">
                    <input type="radio" name="Pachet_Ales" value="START" required>
                    <div style="font-size: 11px; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px;">START</div>
                    <div class="pkg-price" style="font-family: var(--font-serif); font-size: 18px;">297 lei</div>
                </label>

                <label class="package-option">
                    <input type="radio" name="Pachet_Ales" value="START PLUS">
                    <div style="font-size: 11px; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px;">START PLUS</div>
                    <div class="pkg-price" style="font-family: var(--font-serif); font-size: 18px;">397 lei</div>
                </label>
            </div>
        </div>

        <button type="submit" class="btn-submit">Trimite înscrierea</button>
    </form>

    <a href="index.html" class="back-link">← Înapoi la pagina principală</a>
</div>

</body>
</html>
