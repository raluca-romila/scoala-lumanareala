<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mulțumire — Școala de Lumânăreală</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Libraria de confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --color-bg: #F8F5F0;
            --color-bg-white: #FFFFFF;
            --color-accent: #B87333;
            --color-eucalipt: #4A6352;
            --color-border: #D4C8BA;

            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Lato', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            color: var(--color-eucalipt);
            background: var(--color-bg);
            line-height: 1.65;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        h1, h2 { font-family: var(--font-serif); font-weight: 400; color: var(--color-eucalipt); }
        p, a { color: var(--color-eucalipt); }
        em { font-style: italic; color: var(--color-accent); font-weight: 500; }

        .thank-card {
            max-width: 600px;
            margin: 20px;
            padding: 80px 40px 60px;
            background: var(--color-bg-white);
            border-radius: 4px;
            box-shadow: 0 15px 50px rgba(74, 99, 82, 0.1);
            text-align: center;
            width: 100%;
            animation: fadeInSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
            position: relative;
            overflow: hidden; /* Taie trandafirii la marginea cardului */
        }

        @keyframes fadeInSlide {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- STILURI TRANDAFIRI --- */
        .corner-rose {
            position: absolute;
            width: 220px; /* Ajustează dimensiunea florilor de aici */
            height: auto;
            z-index: 1;
            opacity: 0;
            animation: revealRoses 1.2s ease-out 0.5s forwards;
        }

        @keyframes revealRoses {
            to { opacity: 1; }
        }

        /* Poziționarea și rotirea imaginii pentru fiecare colț */
        .tl { top: 0; left: 0; }
        .tr { top: 0; right: 0; transform: scaleX(-1); }
        .bl { bottom: 0; left: 0; transform: scaleY(-1); }
        .br { bottom: 0; right: 0; transform: scale(-1, -1); }

        /* --- CONȚINUT CARD --- */
        .content-wrapper {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 8px;
        }

        .btn-home {
            display: inline-block;
            margin-top: 32px;
            padding: 14px 36px;
            background: var(--color-eucalipt);
            color: var(--color-bg-white);
            border-radius: 4px;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: 700;
            transition: background 0.3s ease;
        }

        .btn-home:hover {
            background: var(--color-accent);
        }
    </style>
</head>
<body>

<div class="thank-card">

    <!-- Cele 4 colțuri cu imaginea ta reală -->
    <img src="pngtree-elegant-red-rose-vine-corner-design-perfect-for-wedding-invitations-png-image_16457055.png" class="corner-rose tl" alt="Decor floral">
    <img src="pngtree-elegant-red-rose-vine-corner-design-perfect-for-wedding-invitations-png-image_16457055.png" class="corner-rose tr" alt="Decor floral">
    <img src="pngtree-elegant-red-rose-vine-corner-design-perfect-for-wedding-invitations-png-image_16457055.png" class="corner-rose bl" alt="Decor floral">
    <img src="pngtree-elegant-red-rose-vine-corner-design-perfect-for-wedding-invitations-png-image_16457055.png" class="corner-rose br" alt="Decor floral">

    <!-- Conținutul -->
    <div class="content-wrapper">
        <div style="margin-bottom: 24px;">
            <!-- Flacăra Monicăi este la locul ei -->
            <img src="flacara-monica.svg" alt="Flacără" style="width: 48px; height: auto; margin: 0 auto 12px; display: block;">
            <h1 style="font-size: 32px; margin-bottom: 8px;">Înscriere <em>înregistrată!</em></h1>
        </div>

        <p style="font-size: 15px; margin-bottom: 24px; line-height: 1.7;">
            Îți mulțumim pentru interes! Datele tale au fost trimise cu succes către echipa noastră.
        </p>

        <div style="background: var(--color-bg); padding: 16px; border-radius: 4px; margin-bottom: 24px;">
            <p style="font-size: 14px; opacity: 0.9;">
                Monica te va contacta în cel mai scurt timp pe <strong>WhatsApp</strong> pentru a stabili detaliile de plată și livrare a cursului.
            </p>
        </div>

        <a href="index.html" class="btn-home">Înapoi la pagina principală</a>
    </div>
</div>

<script>
    // Confetti pe roșu și auriu, asortate cu trandafirii
    window.addEventListener('DOMContentLoaded', () => {
        const duration = 2 * 1000;
        const end = Date.now() + duration;

        const colors = ['#A30000', '#D4AF37', '#B87333', '#4A6352'];

        (function frame() {
            confetti({
                particleCount: 7,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: colors
            });
            confetti({
                particleCount: 7,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: colors
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    });
</script>

</body>
</html>
