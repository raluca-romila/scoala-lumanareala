<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mulțumire — Școala de Lumânăreală</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Libraria de confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --color-bg: #F8F5F0;
            --color-bg-white: #FFFFFF;
            --color-accent: #B87333;
            --color-eucalipt: #4A6352;
            --color-border: #D4C8BA;

            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Lato', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            color: var(--color-eucalipt);
            background: var(--color-bg);
            line-height: 1.65;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        h1, h2 { font-family: var(--font-serif); font-weight: 400; color: var(--color-eucalipt); }
        p, a { color: var(--color-eucalipt); }
        em { font-style: italic; color: var(--color-accent); font-weight: 500; }

        .thank-card {
            max-width: 540px;
            margin: 20px;
            padding: 50px 40px;
            background: var(--color-bg-white);
            border-radius: 8px;
            box-shadow: 0 15px 50px rgba(74, 99, 82, 0.1);
            text-align: center;
            width: 100%;
            animation: fadeInSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
            position: relative;
            z-index: 10;
        }

        @keyframes fadeInSlide {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background: var(--color-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border: 1px solid var(--color-border);
        }

        .btn-home {
            display: inline-block;
            margin-top: 32px;
            padding: 14px 36px;
            background: var(--color-eucalipt);
            color: var(--color-bg-white);
            border-radius: 4px;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: 700;
            transition: background 0.3s ease;
        }

        .btn-home:hover {
            background: var(--color-accent);
        }
    </style>
</head>
<body>

<div class="thank-card">
    <div class="success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-eucalipt)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>

    <div style="margin-bottom: 24px;">
        <img src="flacara-monica.svg" alt="Flacără" style="width: 48px; height: auto; margin: 0 auto 12px; display: block;">
        <h1 style="font-size: 32px; margin-bottom: 8px;">Înscriere <em>înregistrată!</em></h1>
    </div>

    <p style="font-size: 15px; margin-bottom: 24px; line-height: 1.7;">
        Îți mulțumim pentru interes! Datele tale au fost trimise cu succes către echipa noastră.
    </P>

    <div style="background: var(--color-bg); padding: 16px; border-radius: 4px; margin-bottom: 24px;">
        <p style="font-size: 14px; opacity: 0.9;">
            Monica te va contacta în cel mai scurt timp pe <strong>WhatsApp</strong> pentru a stabili detaliile de plată și livrare a cursului.
        </p>
    </div>

    <a href="index.html" class="btn-home">Înapoi la pagina principală</a>
</div>

<script>
    // Efect de confetti aurii care acoperă ecranul timp de 2 secunde
    window.addEventListener('DOMContentLoaded', () => {
        const duration = 2 * 1000;
        const end = Date.now() + duration;

        // Paletă axată pe auriu, bronz și teracotă, asortată cu brandul
        const colors = ['#B87333', '#F8A33A', '#E95267', '#D4C8BA', '#4A6352'];

        (function frame() {
            confetti({
                particleCount: 7,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: colors
            });
            confetti({
                particleCount: 7,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: colors
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    });
</script>

</body>
</html>
